[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-vision-agent"
version = "0.3.0"
description = "Autonomous Desktop Perception, UI Automation, Native OCR, Multi-Monitor & OS Control Engine for AI Agents"
authors = [{ name = "Umut & Antigravity" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "uiautomation>=2.0.29",
    "comtypes>=1.5.0",
    "winocr>=0.0.15",
    "pyperclip>=1.8.0",
    "psutil>=5.9.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: User Interfaces",
]

[project.scripts]
desktop-vision = "desktop_vision.cli:main"
